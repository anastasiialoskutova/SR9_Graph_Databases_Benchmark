services:
  neo4j:
    image: neo4j:5.26-community
    container_name: sr9_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data

  memgraph:
    image: memgraph/memgraph:latest
    container_name: sr9_memgraph
    ports:
      - "7688:7687"
    command: ["--also-log-to-stderr"]
    volumes:
      - memgraph_data:/var/lib/memgraph

volumes:
  neo4j_data:
  memgraph_data:
